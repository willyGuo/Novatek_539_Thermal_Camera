# Tiffany thermal user settings
cfg_boot_load=1
fps=30
output_mode=0
liveview_mirror=1
pseudo_color_mode=0
dde_enable=1
dde_sigma_s=21
dde_sigma_r=51
dde_gain_percent=200
dde_num_iters=2
dde_base_scale=1
clahe_enable=1
clahe_tile_size=32
clahe_clip_limit=4
startup_skip_frames=30
runtime_skip_frames=0
nuc_correction=1
nuc_sensor_temp_interval_sec=60
nuc_sensor_temp_point1=0.0000
nuc_sensor_temp_point2=0.0000
nuc_sensor_temp_point3=0.0000
nuc_sensor_temp_point4=0.0000
nuc_sensor_temp_point5=0.0000
bpr_correction=1
bpr_threshold=15
ffc_correction=1
ffc_startup_enable=1
shutter_interval_sec=60
shutter_close_wait_ms=1500
tdc_correction=0
tdc_interval_sec=60
agc_histogram_p1_p99_enable=0
agc_histogram_p1_p99_temporal_previous_percent=90
agc_histogram_p1_p99_percentile_low=1
agc_histogram_p1_p99_percentile_high=99
agc_fieldscale_enable=0
agc_fieldscale_grid_size=8
agc_fieldscale_les_distance=2
agc_fieldscale_les_threshold=800
agc_fieldscale_message_distance=1
agc_fieldscale_message_iterations=1
agc_fieldscale_temporal_previous_percent=90
agc_weighted_enable=1
agc_weighted_clip_limit=2.0
agc_weighted_redistribute=1
# Bright Weight: finite >= 1, no fixed upper limit; 1 disables bright weighting.
agc_weighted_bright_weight=1.0
# Recalculate percentile DN from the histogram after Clip/Redistribution.
agc_weighted_bright_percentile=70.0
agc_weighted_gain_limit=2.0
# LUT Smooth only. 0 disables temporal LUT blending; no separate background tracker.
agc_weighted_temporal_previous_percent=90
# Balanced Otsu Weighted: 0 Classic, 1 fixed96-Gray background/Weighted hot region.
# Clip/Redistribution/Bright Weight/P adjust hot detail; Gain Limit and Smooth apply once.
agc_weighted_balanced_background=0
# One-shot reset; overrides all Weighted Mapping parameters regardless of order.
# Keeps AGC enable selection, input shift, Gamma and all other settings.
agc_weighted_reset_defaults=0
videoproc_af_enable=1
videoproc_wdr_enable=0
videoproc_defog_enable=0
videoproc_3dnr_enable=0


# RAW Preprocessing: corrections -> RAW temporal denoise -> AGC


# CPU RAW14 temporal denoise. Next frame; 1=50%, 2=75%, 3=87.5% previous.
raw_temporal_denoise_enable=0
raw_temporal_denoise_threshold_dn=12
raw_temporal_denoise_history_shift=2
