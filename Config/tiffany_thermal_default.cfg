# Tiffany thermal default user settings
# Copy this file to /mnt/sd/tiffany_thermal.cfg on the target device.
# CFG menu applies CLAHE and pseudo color immediately; other settings follow their menu instructions.
# Editing this file directly requires reload/restart.

cfg_boot_load=1

# Liveview
# 0: UVC MJPEG, 1: RTSP H.265
output_mode=0
# VPE display mirror (saved RAW/ISP diagnostics unchanged): 0 = normal, 1 = horizontal mirror
liveview_mirror=1
# 0: Black/White, 1: White/Black, 2: Color (Jet), 3: Iron
pseudo_color_mode=0
# UVC: fps=30 or fps=60; restart Liveview/application after changing.
fps=30
startup_skip_frames=30
runtime_skip_frames=0

# NUC
# nuc_correction: CFG menu on/off applies immediately while Liveview is running.
nuc_correction=1
nuc_sensor_temp_interval_sec=60
nuc_sensor_temp_point1=0.0000
nuc_sensor_temp_point2=0.0000
nuc_sensor_temp_point3=0.0000
nuc_sensor_temp_point4=0.0000
nuc_sensor_temp_point5=0.0000

# BPR / ISP DPC
# bpr_correction: CFG menu on/off applies immediately while Liveview is running.
bpr_correction=1
bpr_threshold=15

# FFC interval in seconds; 0 disables periodic calibration only.
shutter_interval_sec=60
shutter_close_wait_ms=200

# FFC
# CFG menu changes apply immediately; enabling without a table first calibrates.
ffc_correction=1
# Run FFC once at Liveview startup after skipping unstable frames, even when ffc_correction=0.
# 0: wait for the normal shutter interval, 1: calibrate immediately.
ffc_startup_enable=1
# Optional blackbody/shutter shading table; requires FFC and prior calibration.
ffc_shading_enable=0

# TDC
tdc_correction=1
tdc_interval_sec=60

# AGC (mutually exclusive; enable at most one)
# Histogram P1/P99 + CPU Linear Stretch
agc_histogram_p1_p99_enable=0
# Integer percentiles: 0 <= low < high <= 100; 0/100 uses min/max.
agc_histogram_p1_p99_percentile_low=1
agc_histogram_p1_p99_percentile_high=99
# Previous smoothed P1/P99 threshold weight: 0..99 percent (0 disables smoothing)
agc_histogram_p1_p99_temporal_previous_percent=90
# Gain Limit: 0 off; 0.1..4.0 Gray per native RAW DN (step 0.1)
agc_histogram_p1_p99_gain_limit=0.0
# RAW14 Min/Max + ISP Tone Curve
# Fieldscale Local Adaptive AGC + temporal smoothing (pure C CPU)
agc_fieldscale_enable=0
# Parameters: CFG menu saves and applies immediately (next Fieldscale frame).
# Grid size per axis: 2/4/8/16/32. Distances: 1..31, clipped at boundaries.
agc_fieldscale_grid_size=8
agc_fieldscale_les_distance=2
# LES threshold: 0..16383 RAW14 DN
agc_fieldscale_les_threshold=400
agc_fieldscale_message_distance=1
# Iterations: 0..32 (0 bypasses message passing)
agc_fieldscale_message_iterations=7
# Previous smoothed field weight: 0..99 percent (0 disables smoothing)
agc_fieldscale_temporal_previous_percent=90

# VideoProc / ISP (applied after Liveview Restart)
videoproc_af_enable=1
videoproc_wdr_enable=1
videoproc_defog_enable=1
videoproc_3dnr_enable=1

# CLAHE: CPU Y8 enhancement before pseudo color; menu changes apply immediately.
clahe_enable=0
# Tile dimensions in pixels: 8, 16, 32
clahe_tile_size=32
# Absolute count per histogram bin: 4..128
clahe_clip_limit=8

# DDE_1106: native CPU Y8, after CLAHE and before pseudo color.
# Menu changes save and apply on next display frame; direct file edits need reload.
# Standard/Fast presets: sigma_s=21, sigma_r=51, gain=200%, passes=2/1; enable unchanged.
dde_enable=0
# Spatial sigma in pixels: integer 1..256
dde_sigma_s=8
# Range sigma in Y8 DN: integer 1..255
dde_sigma_r=16
# Detail gain: 0..1000 percent; 100 = original, 150 = 1.5x
dde_gain_percent=150
# Directional passes: 1..8, alternating forward/reverse; each pair shares sigma.
dde_num_iters=2
# Base scale: 1 full resolution (compatible default); 2 experimental half width/height.
dde_base_scale=1

# Weighted Mapping AGC (global 1x1; manual Clip; mutually exclusive)
agc_weighted_enable=0
agc_weighted_clip_limit=2.0
# Redistribution only fills originally populated DN bins, up to the Clip cap.
agc_weighted_redistribute=1
# Bright Weight: finite >= 1, no fixed upper limit; 1 disables bright weighting.
agc_weighted_bright_weight=1.0
# Recalculate percentile DN from the histogram after Clip/Redistribution.
agc_weighted_bright_percentile=70.0
agc_weighted_gain_limit=2.0
# LUT smoothing: previous weight 0..99%; 0 disables. Parameter changes reset history.
# LUT Smooth only. 0 disables temporal LUT blending; no separate background tracker.
agc_weighted_temporal_previous_percent=90
# Balanced Otsu Weighted: 0 Classic, 1 fixed96-Gray background/Weighted hot region.
# Clip/Redistribution/Bright Weight/P adjust hot detail; Gain Limit and Smooth apply once.
agc_weighted_balanced_background=0
# One-shot reset; overrides all Weighted Mapping parameters regardless of order.
# Keeps AGC enable selection, input shift, Gamma and all other settings.
agc_weighted_reset_defaults=0

# RAW Preprocessing: corrections -> RAW temporal denoise -> AGC


# CPU native-DN temporal denoise after corrections, before corrected snapshot / AGC.
# Sensor RAW14 / corrected UINT16 supported without rescaling or clipping.
# Next live frame applies; difference <= threshold is averaged, larger changes pass.
# history_shift: 1=previous50%, 2=75%, 3=87.5%. Medium trial: 12 DN / 2.
raw_temporal_denoise_enable=0
raw_temporal_denoise_threshold_dn=12
raw_temporal_denoise_history_shift=2
