# Tiffany thermal default user settings
# Copy this file to /mnt/sd/tiffany_thermal.cfg on the target device.
# Changes take effect only after Liveview Restart or reboot.

cfg_boot_load=1

# Liveview
# 0: UVC MJPEG, 1: RTSP H.265
output_mode=0
fps=30
startup_skip_frames=30
runtime_skip_frames=0

# NUC
nuc_correction=1
nuc_sensor_temp_interval_sec=60
nuc_sensor_temp_point1=0.0000
nuc_sensor_temp_point2=0.0000
nuc_sensor_temp_point3=0.0000
nuc_sensor_temp_point4=0.0000
nuc_sensor_temp_point5=0.0000

# BPR / ISP DPC
bpr_correction=1
bpr_threshold=15
runtime_bpr_enable=0
runtime_bpr_threshold=15

# Shared shutter cycle
# FFC and Runtime BPR use the same shutter interval.
shutter_interval_sec=60
shutter_close_wait_ms=200

# FFC
ffc_correction=1

# TDC
tdc_correction=1
tdc_interval_sec=60

# Gamma
gamma_correction=1
gamma_mode=0
gamma_auto_sel=2
gamma_load_bin=0
